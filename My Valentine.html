

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para mi amor</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            max-width: 600px;
            position: relative;
            animation: fadeIn 2s ease-in;
        }
        h1 {
            color: #ff4b6e;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
        p {
            color: #666;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .heart {
            color: #ff4b6e;
            font-size: 3rem;
            animation: heartBeat 1.2s infinite;
            display: inline-block;
            margin: 1rem;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }
        .btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-yes {
            background: #ff4b6e;
            color: white;
        }
        .btn-no {
            background: #999;
            color: white;
        }
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #confetti {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <canvas id="confetti"></canvas>
    <div class="container">
        <span class="heart">❤️</span>
        <h1>Mi Princesa...</h1>
        <p>Cada día me enamoro más de ti, de tu sonrisa, de tu forma de ser.
           Me llenas de paz, solo quiero seguir compartiendo mi vida contigo y poder hacerte muy feliz. Te Amo.
</p>
        <p>¿Me harías el honor de ser mi San Valentín?</p>
        <div class="buttons">
            <button class="btn btn-yes" onclick="sayYes()">¡Sí, mi amor! 💕</button>
            <button class="btn btn-no" onclick="moveNo()">No</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
    <script>
        function moveNo() {
            const btn = document.querySelector('.btn-no');
            btn.style.position = 'absolute';
            btn.style.left = Math.random() * (window.innerWidth - btn.offsetWidth) + 'px';
            btn.style.top = Math.random() * (window.innerHeight - btn.offsetHeight) + 'px';
        }

        function sayYes() {
            document.querySelector('.container').innerHTML = `
                <span class="heart">❤️</span>
                <h1>¡Te amo!</h1>
                <p>Gracias por hacerme la persona más feliz del mundo</p>
                <span class="heart">❤️</span>
            `;
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
